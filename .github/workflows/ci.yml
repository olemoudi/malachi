name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/badges/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Most runs then resolve nothing over the network at all, which is the cheapest
          # possible answer to a rate limiter. The retry below covers the cache miss.
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Through gradle_retry.sh: Maven Central answered 429 to every request on 2026-08-13 and
      # a green commit was mailed out as a failure. A test failure is still reported on the
      # first attempt — see the script.
      - name: Run unit tests
        run: scripts/gradle_retry.sh test

      - name: Aggregated coverage report
        run: scripts/gradle_retry.sh jacocoAggregatedReport

      - name: Generate coverage badge
        run: python3 scripts/coverage_badge.py

      - name: Assemble debug APK
        run: scripts/gradle_retry.sh :app:assembleDebug

      # The badge is a picture, and this step runs four minutes after the checkout — by which
      # time main has usually moved, because cutting a release pushes an empty `chore: cut`
      # commit seconds behind the commit being tested. A plain push is then rejected as a
      # non-fast-forward, `bash -e` returns 1, and a wholly green build is reported as a failure
      # by email. That happened on every release for two days and there was nothing to act on.
      #
      # So: rebase onto whatever is there now and try again, and never fail the build over it.
      # `continue-on-error` is the belt to the retry's braces — if the badge is lost, the next
      # green run writes it again.
      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git diff --quiet .github/badges/coverage.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved under us; rebasing and retrying ($attempt of 3)"
            git fetch origin main && git rebase origin/main || exit 0
          done
          exit 0
